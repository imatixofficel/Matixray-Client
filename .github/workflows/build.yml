name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version to publish, for example 1.0.1 (leave empty for a test build only)"
        required: false
        type: string
      release_notes:
        description: "Message users see when the update is offered"
        required: false
        type: string
      aether_ref:
        description: "Optional: exact Aether commit or tag to build (default: the version current when this project was made)"
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # The native cores are taken as they were when this project snapshot was made, so a newer
      # upstream change cannot break the build. Change the date, or pass aether_ref, to move on.
      CORE_SNAPSHOT_DATE: "2026-10-04 03:00:00 +0000"
      RUST_TOOLCHAIN: "1.99.0"
      GO_VERSION: "1.26"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    # The native cores are built from their own sources, fetched next to the app.
    - name: Fetch native core sources
      env:
        AETHER_REF: ${{ inputs.aether_ref }}
      run: |
        fetch_core () {
          url="$1"; dir="$2"; ref="${3:-}"
          rm -rf "$dir"
          git clone "$url" "$dir"
          if [ -n "$ref" ]; then
            git -C "$dir" checkout "$ref"
          else
            rev=$(git -C "$dir" rev-list -1 --before="$CORE_SNAPSHOT_DATE" HEAD)
            [ -n "$rev" ] && git -C "$dir" checkout "$rev"
          fi
          git -C "$dir" submodule update --init --recursive
          echo "$dir is at $(git -C "$dir" rev-parse HEAD)"
        }
        fetch_core https://github.com/patterniha/AndroidLibXrayLite AndroidLibXrayLite
        fetch_core https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
        fetch_core https://github.com/patterniha/Aether.git aether "$AETHER_REF"
        echo "HEV_REV=$(git -C hev-socks5-tunnel rev-parse HEAD)" >> $GITHUB_ENV
        echo "AETHER_REV=$(git -C aether rev-parse HEAD)" >> $GITHUB_ENV

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.HEV_REV }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.HEV_REV }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ env.AETHER_REV }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-aether.sh

    - name: Save libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ env.AETHER_REV }}-${{ hashFiles('compile-aether.sh') }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: false

    - name: Restore cached Psiphon client
      id: cache-psiphon-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Build the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-psiphon.sh

    - name: Save the Psiphon client
      if: steps.cache-psiphon-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-psiphon
        key: psiphon-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/psiphon-build.sh') }}-${{ hashFiles('compile-psiphon.sh') }}

    - name: Restore cached pluggable transport
      id: cache-pt-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Build the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-pt.sh

    - name: Save the pluggable transport
      if: steps.cache-pt-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-pt
        key: pt-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('aether/pt-build.sh') }}-${{ hashFiles('compile-pt.sh') }}

    - name: Stage the native libraries
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-psiphon/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-pt/. ${{ github.workspace }}/V2rayNG/app/libs/

    - name: Fetch the Psiphon server list
      run: |
        bash fetch-psiphon-servers.sh

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    # Updates only install over an older build when both are signed with the same key, so add the
    # four secrets below. Without them a throw-away key is made, which is fine for testing only.
    - name: Prepare the signing key
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/android_keystore.jks"
          echo "SIGN_FILE=$RUNNER_TEMP/android_keystore.jks" >> $GITHUB_ENV
          echo "SIGN_STORE_PASS=$KS_PASS" >> $GITHUB_ENV
          echo "SIGN_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          echo "SIGN_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
        else
          echo "::warning::No signing secrets found. Using a temporary key, so this APK cannot update an installed release."
          keytool -genkeypair -alias matixray -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore "$RUNNER_TEMP/android_keystore.jks" -storepass matixray -keypass matixray \
            -dname "CN=Matixray"
          echo "SIGN_FILE=$RUNNER_TEMP/android_keystore.jks" >> $GITHUB_ENV
          echo "SIGN_STORE_PASS=matixray" >> $GITHUB_ENV
          echo "SIGN_ALIAS=matixray" >> $GITHUB_ENV
          echo "SIGN_KEY_PASS=matixray" >> $GITHUB_ENV
        fi

    # The wrapper jar is skipped by some upload tools (jar files are often ignored), so it is restored
    # here from the Gradle version named in gradle-wrapper.properties when it is missing.
    - name: Make sure the Gradle wrapper is present
      run: |
        cd ${{ github.workspace }}/V2rayNG
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          version=$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -1)
          echo "Restoring the Gradle wrapper for Gradle $version"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle-dist"
          mkdir -p "$RUNNER_TEMP/wrapper-gen"
          (cd "$RUNNER_TEMP/wrapper-gen" && "$RUNNER_TEMP"/gradle-dist/gradle-*/bin/gradle wrapper --gradle-version "$version" --no-daemon)
          mkdir -p gradle/wrapper
          cp "$RUNNER_TEMP/wrapper-gen/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
        fi
        ls -l gradle/wrapper

    # Unit tests are reported but do not stop the APK from being built.
    - name: Unit tests
      continue-on-error: true
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest

    - name: Build APK
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        VERSION="${RELEASE_TAG#v}"
        ./gradlew assembleRelease \
          -PmatixrayVersion="$VERSION" \
          -Pandroid.injected.signing.store.file="$SIGN_FILE" \
          -Pandroid.injected.signing.store.password="$SIGN_STORE_PASS" \
          -Pandroid.injected.signing.key.alias="$SIGN_ALIAS" \
          -Pandroid.injected.signing.key.password="$SIGN_KEY_PASS"

    - name: Check the native libraries in the APKs
      run: |
        status=0
        for apk in ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk; do
          entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
          echo "$(basename "$apk"):"
          echo "$entries" | sed 's/^/  /'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$entries" | grep -q "^lib/$abi/" || continue
            for lib in libaether.so libpsiphon-tunnel-core.so liblyrebird.so; do
              if ! echo "$entries" | grep -qx "lib/$abi/$lib"; then
                echo "::error::$(basename "$apk") lacks lib/$abi/$lib"
                status=1
              fi
            done
          done
        done
        exit $status

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_tag }}
          name: Matixray v${{ inputs.release_tag }}
          body: ${{ inputs.release_notes }}
          target_commitish: ${{ github.sha }}
          files: release/**/*.apk
          prerelease: false
          fail_on_unmatched_files: true
